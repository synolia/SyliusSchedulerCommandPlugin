name: Install & Test
'on':
    push:
        branches:
            - main
            - master
        paths-ignore:
            - '**.md'
    pull_request:
        paths-ignore:
            - '**.md'
concurrency:
    group: '${{ github.workflow }}-${{ github.ref }}'
    cancel-in-progress: true
jobs:
    sylius:
        name: 'PHP ${{ matrix.php }} Sylius ${{ matrix.sylius }} Symfony ${{ matrix.symfony }} Node ${{ matrix.node }}'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Sylius 2.2: PHP >= 8.2, Symfony 7.4 only
                # Sylius 2.3: PHP >= 8.3, Symfony 7.4 / 8.x (Symfony 8 requires PHP >= 8.4)
                # Symfony 8.0 is not tested: end of life since July 2026, every 8.0 release is blocked by a security advisory
                # Node rotates so that each Node version is tested with each Sylius version
                include:
                    - { sylius: 2.2.0, symfony: '7.4', php: '8.2', node: 22.x }
                    - { sylius: 2.2.0, symfony: '7.4', php: '8.3', node: 24.x }
                    - { sylius: 2.2.0, symfony: '7.4', php: '8.4', node: 26.x }
                    - { sylius: 2.2.0, symfony: '7.4', php: '8.5', node: 22.x }
                    - { sylius: 2.2.0, symfony: '7.4', php: '8.6', node: 24.x }
                    - { sylius: 2.3.0, symfony: '7.4', php: '8.3', node: 22.x }
                    - { sylius: 2.3.0, symfony: '7.4', php: '8.4', node: 24.x }
                    - { sylius: 2.3.0, symfony: '7.4', php: '8.5', node: 26.x }
                    - { sylius: 2.3.0, symfony: '7.4', php: '8.6', node: 26.x }
                    - { sylius: 2.3.0, symfony: '8.1', php: '8.4', node: 22.x }
                    - { sylius: 2.3.0, symfony: '8.1', php: '8.5', node: 24.x }
                    - { sylius: 2.3.0, symfony: '8.1', php: '8.6', node: 26.x }
        env:
            APP_ENV: test
        steps:
            -
                name: 'Setup PHP'
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '${{ matrix.php }}'
                    ini-values: date.timezone=UTC
                    extensions: intl
                    tools: symfony
                    coverage: none
            -
                name: 'Setup Node'
                uses: actions/setup-node@v7
                with:
                    node-version: '${{ matrix.node }}'
            -
                uses: actions/checkout@v7
            -
                name: 'Composer - Get Cache Directory'
                id: composer-cache
                run: 'echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"'
            -
                name: 'Composer - Set cache'
                uses: actions/cache@v6
                with:
                    path: '${{ steps.composer-cache.outputs.dir }}'
                    key: 'php-${{ matrix.php }}-sylius-${{ matrix.sylius }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles(''**/composer.json'') }}'
                    restore-keys: 'php-${{ matrix.php }}-sylius-${{ matrix.sylius }}-symfony-${{ matrix.symfony }}-composer-'
            -
                name: 'Composer - Github Auth'
                run: 'composer config -g github-oauth.github.com ${{ github.token }}'
            -
                name: 'Yarn - Get cache directory'
                id: yarn-cache
                run: 'echo "dir=$(yarn cache dir 2>/dev/null || npx --yes yarn@1.22.22 cache dir)" >> "$GITHUB_OUTPUT"'
            -
                name: 'Yarn - Set Cache'
                uses: actions/cache@v6
                with:
                    path: '${{ steps.yarn-cache.outputs.dir }}'
                    key: 'node-${{ matrix.node }}-sylius-${{ matrix.sylius }}-yarn-${{ hashFiles(''**/package.json'') }}'
                    restore-keys: 'node-${{ matrix.node }}-sylius-${{ matrix.sylius }}-yarn-'
            -
                name: 'Install plugin with Sylius Test Application'
                run: 'make install -e SYLIUS_VERSION=${{ matrix.sylius }} SYMFONY_VERSION=${{ matrix.symfony }}'
            -
                name: 'Doctrine Schema Validate - Run'
                run: 'vendor/bin/console doctrine:schema:validate --skip-sync'
            -
                name: 'Lint container'
                run: 'vendor/bin/console lint:container'
            -
                name: 'Run PHPUnit'
                run: 'make phpunit'
        services:
            mariadb:
                image: 'mariadb:10.11'
                ports:
                    - '3306:3306'
                env:
                    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'true'
                options: '--health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10'

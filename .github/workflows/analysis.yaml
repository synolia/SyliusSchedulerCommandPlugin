name: Analysis
'on':
    push:
        branches:
            - main
            - master
        paths-ignore:
            - '**.md'
    pull_request:
        paths-ignore:
            - '**.md'
concurrency:
    group: '${{ github.workflow }}-${{ github.ref }}'
    cancel-in-progress: true
jobs:
    analysis:
        name: 'PHP ${{ matrix.php }} Symfony ${{ matrix.symfony }}'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Lowest, intermediate and highest supported stacks (Symfony 8 requires PHP >= 8.4)
                include:
                    - { php: '8.2', symfony: '7.4.*' }
                    - { php: '8.4', symfony: '8.1.*' }
                    - { php: '8.6', symfony: '8.1.*' }
        env:
            APP_ENV: test
        steps:
            -
                uses: actions/checkout@v7
            -
                name: 'Setup PHP'
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '${{ matrix.php }}'
                    tools: symfony
                    coverage: none
            -
                name: 'Composer - Get Cache Directory'
                id: composer-cache
                run: 'echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"'
            -
                name: 'Composer - Set cache'
                uses: actions/cache@v6
                with:
                    path: '${{ steps.composer-cache.outputs.dir }}'
                    key: 'php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles(''**/composer.json'') }}'
                    restore-keys: 'php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-'
            -
                name: 'Composer - Validate composer.json'
                run: 'composer validate --strict'
            -
                name: 'Composer - Github Auth'
                run: 'composer config -g github-oauth.github.com ${{ github.token }}'
            -
                name: 'Composer - Install Symfony Flex globally'
                run: 'composer global config --no-plugins allow-plugins.symfony/flex true && composer global require --no-progress --no-scripts --no-plugins symfony/flex'
            -
                name: 'Composer - Restrict Symfony version'
                run: 'composer config extra.symfony.require "${{ matrix.symfony }}"'
            -
                name: 'Composer - Update dependencies'
                run: 'composer update --no-progress'
                id: end-of-setup
            -
                name: 'ECS - Run'
                run: 'if [ -f ruleset/ecs.php ]; then vendor/bin/ecs check src/ --no-progress-bar -c ruleset/ecs.php ; else echo Ecs ruleset file does not exist, skipping step ; fi'
                if: 'always() && steps.end-of-setup.outcome == ''success'''
            -
                name: 'PHPStan - Run'
                run: 'if [ -f ruleset/phpstan.neon ]; then vendor/bin/phpstan analyse -c ruleset/phpstan.neon src/ ; else echo PHPStan ruleset file does not exist, skipping step ; fi'
                if: 'always() && steps.end-of-setup.outcome == ''success'''
            -
                name: 'PHPSpec - Run'
                run: 'if [ -f phpspec.yml.dist ]; then vendor/bin/phpspec run ; else echo PHPSpec config file does not exist, skipping step ; fi'
                if: 'always() && steps.end-of-setup.outcome == ''success'''
            -
                name: 'PHPMD - Run'
                run: |
                    if [ ! -f ruleset/.php_md.xml ]; then echo PHPMD config file does not exist, skipping step; exit 0; fi
                    if vendor/bin/phpmd --version | grep -q 'PHPMD 3'; then vendor/bin/phpmd analyze src --format ansi --ruleset ruleset/.php_md.xml; else vendor/bin/phpmd src ansi ruleset/.php_md.xml; fi
                if: 'always() && steps.end-of-setup.outcome == ''success'''
            -
                name: 'GrumPHP - Run'
                run: 'if [ -f grumphp.yml ]; then vendor/bin/grumphp run ; else echo Grumphp ruleset file does not exist, skipping step ; fi'
                if: 'always() && steps.end-of-setup.outcome == ''success'''
            -
                uses: symfonycorp/security-checker-action@v5
                if: 'always() && steps.end-of-setup.outcome == ''success'''
                continue-on-error: true
